# fishHook
sebastian=Sebasti\u00E1n
sebastianDesc=Se rumorea que este cebo está inspirado en un antiguo músico de la corte real submarina.\n\nLa leyenda cuenta que, cuando este cangrejo toca el agua, los peces sienten la necesidad de montar un número musical coreografiado.
destructor=Destructor de Fauna
destructorDesc=Su diseño resulta tan hipnótico que los peces dejan de cazar para organizar interminables colas frente a él.\n\nEcosistemas enteros han colapsado por inanición simplemente porque las especies prefieren morirse de hambre guardando el sitio antes que perder su turno de ser pescados.
crazyEye=Ojo de Loca
crazyEyeDesc=Este diseño replica una bestia mitológica avistada por dos pescadores ahogados en ginebra durante una oscura madrugada de 1923.\n\nAquella fue la primera y única vez que se documentó a la criatura.
classicHook=Anzuelo?
classicHookDesc=Este modelo cuenta con un patrón de camuflaje táctico tan bueno que los propios humanos no logran verlo.\n\nLos peces, por supuesto, tampoco lo ven, chocan de cara contra el por accidente y acaban capturados.
ladyHook=Princesa
ladyHookDesc=Por motivos legales, tenemos estrictamente prohibido comercializar el anzuelo Princesa original.\n\nLa ley nos obliga a enviarte una réplica tan exageradamente realista que deberás dar explicaciónes a la policia en caso de que te descubran usandola.
gamingHook=Anzuelo Gaming
gamingHookDesc=Su envoltorio asegura con letras fosforescentes que atarlo a la caña aumentará drásticamente los FPS en el Fortnite.\n\nLos peces acaban mordiendo el anzuelo por puro desconcierto frente a la estupidez humana.
joaquinCortes=Joaquín Cortés
joaquinCortesDesc=El nivel de danza de este cebo tiene tanta fluidez y arte que los peces no lo soportan.\n\nSufren síncopes repentinos en cuanto arranca el espectáculo y simplemente flotan desmayados hacia la superficie.

# fishLine
dentalFloss=Hilo dental
dentalFlossDesc=Es un hilo dental, supongo que funciona como hilo, aunque es demasiado débil. \n\nAl menos los que pesques van a tener buena higiene dental.
rj45=Par trenzado
rj45Desc=Cable de red Cat 6A con 10 Gbps de velocidad máxima, una frecuencia de 250 MHz y una distancia efectiva de 100m. \n\nIdeal para pescar redes de alta velocidad.
wool=Lana para crochet
woolDesc=Ovillo de lana verde, es algo llamativo para pescar por su color verde, además si se moja pierde fuerza y se vuelve algo elástica pero puedes crochetear un pez guapisimo.
regularLine=Hilo de pesca
regularLineDesc=Hilo de pesca normal, ideal para la pesca cuenta con una alta resistencia y una baja memoria, diseñado para ofrecer lances suaves y nudos seguros. \n\nSu elasticidad controlada absorbe los impactos de fforma eficiente, siendo la opción ideal para cualquier jornada de pesca.

# livingBait
baityBait=BaityBait
baityBaitDesc=Al sumergirlo empieza a soltar monólogos mencionando 2 vacas o una chinchilla.\n\nEs bastante convincente y los peces pican el anzuelo instantaneamente despues de que les diga "Espabila que la vida te va a comer!".
boxAndCheese=Atrapa-Quesitos
boxAndCheeseDesc=Puede resultar simple, pero es increiblemente eficaz, no hay pez que se resista a una buena rodaja de queso y para el momento en el que se dan cuenta de que es una trampa ya es demasiado tarde.
clickBait=ClickBait
clickBaitDesc=Tiene formas llamativas, flechas, circulos y un influencer con cara de asombro indicando dando a entender que el interior del cebo es increiblemente interesante.\n\nSorprendentemente, una gran cantidad de peces no se lo piensan 2 veces en entrar en el cebo.
dancingShrimps=Gambas al compás
dancingShrimpsDesc=Son gambas de lo más marchosas, por su corpulencia son capaces de andar y bailar sobre la arena al son de la música.\n\nPor algun motivo, son capaces de entender perfectamente los numeros 1, 2 y 3 y las letras A, B y C y como te escuchen mencionarlos saltarán al unísono.
rivulet=Rivulet
rivuletDesc=Es un gato? Es una babosa? Es un ajolote? No se sabe muy bien.\n\nLo que si se sabe con certeza es que es un genocida que disfruta de la destrucción y se jacta de haber asesinado a un dios.
worms=Gusanos
wormsDesc=Gusanos 👍

#fish
espetos=espetos
espetosDesc=Ups hemos llegado tarde, estan muy buenos eso si, y ademas es una gran fuente de Omega-3, sobre todo en malaguita en la costa de la playa
pezBalon=pez balón
pezBalonDesc=¡He pescado un pez balón! ¡Podré hacer una competición!
feo=Pez feo
feoDesc=Una masa gelatinosa con cara de decepción absoluta. Tiene la textura de un flan triste y refleja exactamente cómo se siente usar java swing.
tilapiaDesc=No te dejes engañar por su aspecto inofensivo; esta especie sobrevive hasta en un charco de lluvia. Se reproducen tan rápido que si dejas dos en un cubo de agua, mañana tendrás cuatro. Una captura sin mucho mérito, pero que llena el estómago.
tilapia=Tilapia
asshole=Pez con Cara de gilipollas
assholeDesc=Un espécimen diminuto con un ojo gigante que te mira fijamente con el vacío existencial de quien no sabe ni cómo ha acabado en tu anzuelo. Se transparentan sus tripas porque evolutivamente ni se molestó en desarrollar una piel opaca. \n\nNo sirve ni para hacer caldo, pero su mirada de incomprensión absoluta justifica plenamente su nombre.

# stool
commonStool=Banquito de Baño
commonStoolDesc=Un banquito de plástico pequeño, de esos que se usan en los baños para alcanzar la estantería.\n\nNo hace gracia hasta que lo necesitas y entonces te salva la tarde.
flamingoStool=Flamenco
flamingoStoolDesc=Un flotador con forma de flamenco diseñado para que puedas sentarte y sentirte increible.\n\nTe permite esperar a que piquen los peces sin tocar el agua, que ya bastante humillación supone no sacar nada.
fridgeStool=Nevera
fridgeStoolDesc=Un frigorífico portátil de los que nunca dejan que una cerveza llegue caliente.\n\nCabe hielo, bebida y es un asiento la mar de cómodo.
furStool=Peludito
furStoolDesc=Un asiento que grita riqueza y malas decisiones.\n\nSentarse aquí no te hace mejor pescador, pero sí te hace parecer alguien que cobra por escuchar sus propias ideas.
parkStool=Banco de Parque
parkStoolDesc=Literalmente el banco de un parque: recto, público y con el mismo nivel de comodidad que sentarte en la carrocería de un coche.\n\nIdeal para mirar palomas, lamentar decisiones y fingir que estás reflexionando mientras esperas que piquen.
turtleStool=Tortuga
turtleStoolDesc=A primera vista parece un banco normal, pero de vez en cuando se mueve solo.\n\nSi te sientas demasiado tiempo, tienes la sensación de que te observa y te juzga lentamente.


#fishingRod
vwRod=Caña Volkswagen
vwRodDesc=Ingeniería alemana aplicada a la pesca. Viene con un software trucado de serie que falsea el peso de los peces en el visor para que parezcan más grandes. \n\nNo pasa la ITV, pero tus amigos van a flipar en las fotos.
minecraftRod=Caña de Minecraft
minecraftRodDesc=Fabricada de forma pixelada con tres palos de madera y dos hilos de araña. Cuenta con el encantamiento Atracción III preinstalado de forma nativa. \n\nPerfecta para pescar peces globo y libros de encantamientos.
sugarRod=Caña de azúcar
sugarRodDesc=Literalmente un tallo dulce arrancado de una plantación. No va a aguantar el tirón de ningún pez con un mínimo de fuerza, pero si te aburres esperando, al menos puedes masticarla para un chute de glucosa. \n\nIdeal para pescadores diabéticos amantes del riesgo.
oldRod=Caña Vieja
oldRodDesc=La reliquia oxidada que te regaló un pescador desconocido en una ruta perdida. Solo sirve para capturar Magikarps de nivel 5 que únicamente conocen el movimiento Salpicadura.

