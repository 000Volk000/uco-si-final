# fishHook
sebastian=Sebasti\u00E1n
sebastianDesc=Se rumorea que este cebo está inspirado en un antiguo músico de la corte real submarina.\n\nLa leyenda cuenta que, cuando este cangrejo toca el agua, los peces sienten la necesidad de montar un número musical coreografiado.
destructor=Destructor de Fauna
destructorDesc=Su diseño resulta tan hipnótico que los peces dejan de cazar para organizar interminables colas frente a él.\n\nEcosistemas enteros han colapsado por inanición simplemente porque las especies prefieren morirse de hambre guardando el sitio antes que perder su turno de ser pescados.
crazyEye=Ojo de Loca
crazyEyeDesc=Este diseño replica una bestia mitológica avistada por dos pescadores ahogados en ginebra durante una oscura madrugada de 1923.\n\nAquella fue la primera y única vez que se documentó a la criatura.
classicHook=Anzuelo?
classicHookDesc=Este modelo cuenta con un patrón de camuflaje táctico tan bueno que los propios humanos no logran verlo.\n\nLos peces, por supuesto, tampoco lo ven, chocan de cara contra el por accidente y acaban capturados.
ladyHook=Princesa
ladyHookDesc=Por motivos legales, tenemos estrictamente prohibido comercializar el anzuelo Princesa original.\n\nLa ley nos obliga a enviarte una réplica tan exageradamente realista que deberás dar explicaciónes a la policia en caso de que te descubran usandola.
gamingHook=Anzuelo Gaming
gamingHookDesc=Su envoltorio asegura con letras fosforescentes que atarlo a la caña aumentará drásticamente los FPS en el Fortnite.\n\nLos peces acaban mordiendo el anzuelo por puro desconcierto frente a la estupidez humana.
joaquinCortes=Joaquín Cortés
joaquinCortesDesc=El nivel de danza de este cebo tiene tanta fluidez y arte que los peces no lo soportan.\n\nSufren síncopes repentinos en cuanto arranca el espectáculo y simplemente flotan desmayados hacia la superficie.
