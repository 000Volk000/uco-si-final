# fishHook
sebastian=Sebasti\u00E1n
sebastianDesc=Rumor has it that this bait is inspired by an ancient musician of the underwater royal court.\n\nLegend has it that when this crab touches the water, fish feel the urge to perform a choreographed musical number.
destructor=Wildlife Destructor
destructorDesc=Its design is so hypnotic that fish stop hunting to form endless queues in front of it.\n\nEntire ecosystems have collapsed from starvation simply because species would rather starve to death saving their spot than lose their turn to get caught.
crazyEye=Crazy Eye
crazyEyeDesc=This design replicates a mythological beast spotted by two fishermen drowning in gin during a dark early morning in 1923.\n\nThat was the first and only time the creature was ever documented.
classicHook=Hook?
classicHookDesc=This model features a tactical camouflage pattern so good that humans themselves can't see it.\n\nFish, naturally, don't see it either. They faceplant right into it by accident and end up captured.
ladyHook=Lady
ladyHookDesc=For legal reasons, we are strictly forbidden from selling the original Lady hook.\n\nThe law forces us to send you a replica so absurdly realistic that you'll have some explaining to do to the police if you get caught using it.
gamingHook=Gaming Hook
gamingHookDesc=Its packaging claims in phosphorescent letters that tying this to your rod will drastically boost your FPS in Fortnite.\n\nFish end up biting the hook out of pure bewilderment at human stupidity.
joaquinCortes=Joaquin Cortes
joaquinCortesDesc=The dancing level of this bait has so much flow and artistry that the fish just can't handle it.\n\nThey suffer spontaneous fainting spells the moment the show starts, simply floating unconscious to the surface.

# stool
commonStool=Bathroom Stool
commonStoolDesc=A small plastic stool, the kind people use in bathrooms to reach the shelf.\n\nIt isn't funny until you need it, and then it saves the day.
flamingoStool=Flamingo
flamingoStoolDesc=A flamingo-shaped float designed so you can sit down and feel great.\n\nIt lets you wait for the fish without touching the water, which is already enough humiliation when you're not catching anything.
fridgeStool=Fridge
fridgeStoolDesc=A portable cooler that never lets a beer get warm.\n\nIt holds ice, drinks, and makes for a very comfortable seat.
furStool=Fluffy
furStoolDesc=A seat that screams wealth and bad decisions.\n\nSitting here doesn't make you a better fisherman, but it does make you look like someone who gets paid to hear their own ideas.
parkStool=Park Bench
parkStoolDesc=Literally a park bench: straight, public, and about as comfortable as sitting on a car body.\n\nIdeal for watching pigeons, regretting choices, and pretending you're reflecting while you wait for a bite.
turtleStool=Turtle
turtleStoolDesc=At first glance it looks like a normal bench, but every now and then it moves on its own.\n\nIf you sit on it too long, you get the feeling that it is watching and judging you slowly.