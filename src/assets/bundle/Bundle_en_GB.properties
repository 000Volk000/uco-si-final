# fishHook
sebastian=Sebasti\u00E1n
sebastianDesc=Rumor has it that this bait is inspired by an ancient musician of the underwater royal court.\n\nLegend has it that when this crab touches the water, fish feel the urge to perform a choreographed musical number.
destructor=Wildlife Destructor
destructorDesc=Its design is so hypnotic that fish stop hunting to form endless queues in front of it.\n\nEntire ecosystems have collapsed from starvation simply because species would rather starve to death saving their spot than lose their turn to get caught.
crazyEye=Crazy Eye
crazyEyeDesc=This design replicates a mythological beast spotted by two fishermen drowning in gin during a dark early morning in 1923.\n\nThat was the first and only time the creature was ever documented.
classicHook=Hook?
classicHookDesc=This model features a tactical camouflage pattern so good that humans themselves can't see it.\n\nFish, naturally, don't see it either. They faceplant right into it by accident and end up captured.
ladyHook=Lady
ladyHookDesc=For legal reasons, we are strictly forbidden from selling the original Lady hook.\n\nThe law forces us to send you a replica so absurdly realistic that you'll have some explaining to do to the police if you get caught using it.
gamingHook=Gaming Hook
gamingHookDesc=Its packaging claims in phosphorescent letters that tying this to your rod will drastically boost your FPS in Fortnite.\n\nFish end up biting the hook out of pure bewilderment at human stupidity.
joaquinCortes=Joaquin Cortes
joaquinCortesDesc=The dancing level of this bait has so much flow and artistry that the fish just can't handle it.\n\nThey suffer spontaneous fainting spells the moment the show starts, simply floating unconscious to the surface.

# fishLine
dentalFloss=Dental floss
dentalFlossDesc=It's dental floss, I guess it works like a line, it's too weak tho. \n\nAt least the ones you catch will have good dental hygiene.
rj45=Twisted pair
rj45Desc=Cat 6A network cable with 10 Gbps maximum speed, a frequency of 500 MHz and an effective distance of 100m. \n\nIdeal for fishing high-speed networks.
wool=Crochet yarn
woolDesc=Green yarn ball, it's quite eye-catching for fishing due to its green color; plus, if it gets wet it loses strength and becomes somewhat elastic, but you can crochet an awesome fish.
regularLine=Fishing line
regularLineDesc=Normal fishing line, ideal for fishing. It features high strength and low memory, designed to offer smooth casts and secure knots. \n\nIts controlled elasticity absorbs impacts efficiently, making it the ideal choice for any fishing day.

# livingBait
baityBait=BaityBait
baityBaitDesc=When submerged, it starts spouting monologues about 2 cows or a chinchilla.\n\nIt's pretty convincing, and fish bite instantly after it tells them, "Espabila que la vida te va a comer!"
boxAndCheese=Catch-a-Cheesy
boxAndCheeseDesc=It may seem simple, but it's incredibly effective. No fish can resist a good slice of cheese, and by the time they realize it's a trap, it's already too late.
clickBait=ClickBait
clickBaitDesc=It has flashy shapes, arrows, circles, and an influencer with a shocked face pointing at it to suggest that the bait's contents are incredibly interesting.\n\nSurprisingly, a huge number of fish don't think twice before entering the bait.
dancingShrimps=Dancing Shrimps
dancingShrimpsDesc=These shrimps are quite lively; thanks to their build, they can walk and dance across the sand to the beat of the music.\n\nFor some reason, they can perfectly understand the numbers 1, 2, and 3 and the letters A, B, and C, and if they hear you mention them, they all jump in unison.
rivulet=Rivulet
rivuletDesc=Is it a cat? Is it a slug? Is it an axolotl? Nobody really knows.\n\nWhat is known for sure is that it's a genocidal creature that enjoys destruction and boasts about having murdered a god.
worms=Worms
wormsDesc=Worms 👍


#fish
espetos=espetos
espetosDesc=Oops, we arrived late! They are delicious though, and also a great source of Omega-3, especially in Malaga by the beach coast.
pezBalon=Footballfish
pezBalonDesc=I caught a footballfish! Now I can start a tournament!
feo=Ugly fish
feoDesc=A gelatinous mass with a face of absolute disappointment. It has the texture of a sad flan and perfectly reflects what using Java Swing feels like.
tilapia=Tilapia
tilapiaDesc=Don't let its harmless look fool you; this species can survive even in a rain puddle. They reproduce so fast that if you leave two in a bucket of water, tomorrow you'll have four. A catch with not much merit, but it fills the stomach.
asshole=Asshole fish
assholeDesc=A tiny specimen with a giant eye that stares at you with the existential void of someone who doesn't even know how they ended up on your hook. Its guts are showing because evolution didn't even bother to develop opaque skin. \n\nIt's not even good for making broth, but its look of absolute incomprehension fully justifies its name.

# stool
commonStool=Bathroom Stool
commonStoolDesc=A small plastic stool, the kind people use in bathrooms to reach the shelf.\n\nIt isn't funny until you need it, and then it saves the day.
flamingoStool=Flamingo
flamingoStoolDesc=A flamingo-shaped float designed so you can sit down and feel great.\n\nIt lets you wait for the fish without touching the water, which is already enough humiliation when you're not catching anything.
fridgeStool=Fridge
fridgeStoolDesc=A portable cooler that never lets a beer get warm.\n\nIt holds ice, drinks, and makes for a very comfortable seat.
furStool=Fluffy
furStoolDesc=A seat that screams wealth and bad decisions.\n\nSitting here doesn't make you a better fisherman, but it does make you look like someone who gets paid to hear their own ideas.
parkStool=Park Bench
parkStoolDesc=Literally a park bench: straight, public, and about as comfortable as sitting on a car body.\n\nIdeal for watching pigeons, regretting choices, and pretending you're reflecting while you wait for a bite.
turtleStool=Turtle
turtleStoolDesc=At first glance it looks like a normal bench, but every now and then it moves on its own.\n\nIf you sit on it too long, you get the feeling that it is watching and judging you slowly.

#fishingRod
vwRod=Volkswagen Rod
vwRodDesc=German engineering applied to fishing. It comes with rigged software as standard that fakes the weight of the fish on the display to make them look bigger. \n\nIt won't pass the vehicle inspection, but your friends will be blown away by the photos.
minecraftRod=Minecraft Rod
minecraftRodDesc=Crafted in a pixelated way with three wooden sticks and two pieces of string. It features the Lure III enchantment natively pre-installed. \n\nPerfect for catching pufferfish and enchantments books.
sugarRod=Sugar Cane Rod
sugarRodDesc=Literally a sweet stalk ripped from a plantation. It won't hold up to the pull of any fish with a minimum of strength, but if you get bored waiting, at least you can chew on it for a glucose rush. \n\nIdeal for risk-loving diabetic fishermen.
oldRod=Old Rod
oldRodDesc=The rusty relic given to you by an unknown fisherman on a lost route. It's only good for catching level 5 Magikarps that only know the move Splash.


